<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICY NUS · Indonesian Catholic Youth</title>
<meta name="description" content="ICY NUS: the Indonesian Catholic Youth community at NUS, part of AmoreDio under KKIS. Cell Group, events, gallery, exam prayers, Q&amp;A and prayer requests.">
<meta name="theme-color" content="#F4F3F8">
<script>try{if(localStorage.getItem('icy.theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');document.querySelector('meta[name=theme-color]').setAttribute('content','#050505')}}catch(e){}</script>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  /* theme colours: white by default, swapped by [data-theme=dark] below */
  --bg:#F4F3F8; --panel:#fff; --panel-hover:#FAFAFD; --raised:#F0EFF5; --raised-2:#E5E3EE; --edge:rgba(11,11,11,.08);
  --fg:#0B0B0B; --fg-2:#3F3F48; --muted:#5C5C66; --dim:#6F6F7A; --accent:#5A41D8; --line:#E4E3EA;
  --field:#FAFAFC; --field-line:#D9D7E3; --box-line:#A9A7B6; --seg-on:#0B0B0B; --seg-on-fg:#fff;
  --me:#EEF6B0; --me-fg:#0B0B0B; --warn:#FDECE7; --warn-fg:#8F2A12; --err:#B3261E; --toast:#0B0B0B; --toast-fg:#fff;
  --grad:radial-gradient(110% 80% at 0% 0%,#F1F9B0 0%,transparent 58%),linear-gradient(180deg,#EEF6F7 0%,#E9F0FA 55%,#E6E0FB 100%);
  /* brand colours, the same in both themes */
  --lime:#E4F65A; --lav:#B5A6F5; --violet:#5A41D8; --pink:#F9C9F4; --pink-ink:#8F1480;
  --sky:#BFE0EA; --peach:#FFD9A8; --mint:#C8F0D0;
  --ink:#0B0B0B; --ink-2:#3F3F48; --ink-3:#5C5C66; --cell:#EFEDF5; --hair:#E4E3EA;
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#050505; --panel:#151515; --panel-hover:#1B1B1B; --raised:#232323; --raised-2:#2E2E2E; --edge:transparent;
  --fg:#fff; --fg-2:#E6E6EA; --muted:#A3A3A8; --dim:#8A8A90; --accent:#E4F65A; --line:#262626;
  --field:#0D0D0D; --field-line:#2F2F2F; --box-line:#555; --seg-on:#fff; --seg-on-fg:#0B0B0B;
  --me:#33361A; --me-fg:#E4F65A; --warn:#2A1712; --warn-fg:#FFD4C8; --err:#FFB4A8; --toast:#fff; --toast-fg:#0B0B0B;
  --grad:radial-gradient(110% 80% at 0% 0%,var(--lime) 0%,transparent 58%),linear-gradient(180deg,#D7E8EA 0%,#CFDCF1 55%,#C4B5F4 100%);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:"Red Hat Display","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-size:40px;font-weight:600;line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere}
h2{font-size:22px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
h3{font-size:16px;font-weight:600}
a{color:inherit}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;padding:0;background:none;color:inherit}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.pane :focus-visible{outline-color:var(--accent)}
[hidden]{display:none!important}
svg{flex:none}

#app{max-width:1360px;margin:0 auto;min-height:100vh;padding:16px;display:flex;flex-direction:column;gap:12px}

/* ---------- shared pieces ---------- */
.panel{background:var(--panel);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:inset 0 0 0 1px var(--edge)}
.main{border-radius:28px;padding:28px;color:var(--ink);background:var(--grad);color-scheme:light;display:flex;flex-direction:column;gap:22px;min-width:0}
.sub{font-size:14px;line-height:1.55;color:var(--muted)}
.sub-ink{font-size:15px;line-height:1.55;color:var(--ink-2)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.row{display:flex;align-items:center;gap:8px}
.row.end{justify-content:flex-end}
.grow{flex:1 1 auto;min-width:0}
.divider{height:1px;background:var(--line);margin:2px 0}
.count{min-width:28px;height:28px;padding:0 8px;border-radius:14px;background:var(--raised);display:inline-grid;place-items:center;font-size:13px;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:9px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;white-space:nowrap;align-self:flex-start}
.tag.pink{background:var(--pink);color:var(--pink-ink)}
.tag.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime)}
.btn-lime,.btn-black,.btn-white{min-height:48px;padding:0 22px;border-radius:14px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn-lime{background:var(--lime);color:var(--ink)}
.btn-lime:hover{background:#EEFB7E}
.btn-black{background:var(--ink);color:#fff}
.btn-black:hover{background:#2A2A2A}
.btn-white{background:#fff;color:var(--ink)}
.btn-white:hover{background:#F3F2F8}
.chip-btn{height:40px;padding:0 14px;border-radius:20px;background:var(--raised);color:var(--fg);font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.chip-btn:hover{background:var(--raised-2)}
.chip-lt{height:40px;padding:0 16px;border-radius:20px;background:rgba(255,255,255,.7);color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap}
.chip-lt:hover{background:#fff}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.icon-btn:hover{background:var(--raised)}
.icon-btn.ink{color:var(--ink)}
.icon-btn.ink:hover{background:rgba(11,11,11,.08)}
.x{width:36px;height:36px;flex:none;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.x:hover{background:var(--raised);color:var(--fg)}
.lt .x{color:var(--ink-3)}
.lt .x:hover{background:rgba(11,11,11,.07);color:var(--ink)}
.avatar{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink)}
.avatar.sm{width:26px;height:26px;font-size:11px}
.avatar.anon{background:#D9D7E3;color:var(--ink-3)}
.empty{background:rgba(255,255,255,.55);border-radius:24px;padding:40px 24px;text-align:center;font-size:15px;line-height:1.55;color:var(--ink-2)}
.alert{background:#fff;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:600;color:#9B1C1C}

/* segmented controls: white pills on the gradient, themed ones in panels */
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(11,11,11,.1);align-self:flex-start;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button,.seg a{min-height:40px;padding:0 18px;border-radius:11px;font-size:15px;font-weight:500;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;text-decoration:none}
.seg .on{background:#fff}
.seg.pane{background:var(--raised)}
.seg.pane a{min-height:44px;padding:0 16px;font-size:14px;font-weight:600;color:var(--fg)}
.seg.pane a:hover:not(.on){background:var(--raised-2)}
.seg.pane .on{background:var(--seg-on);color:var(--seg-on-fg)}

/* forms: themed inputs in panels and dialogs, light ones on white cards */
.form{display:flex;flex-direction:column;gap:14px}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.lbl .opt{font-weight:500;color:var(--dim)}
.pane input:not([type=checkbox]):not([type=radio]),.pane textarea{width:100%;min-width:0;padding:12px 14px;border:1px solid var(--field-line);border-radius:14px;background:var(--field);color:var(--fg);font-size:15px}
.pane input:not([type=checkbox]):not([type=radio]){height:46px;padding:0 14px}
.pane textarea{resize:vertical;min-height:110px;line-height:1.5}
.pane input::placeholder,.pane textarea::placeholder{color:var(--dim)}
.lt input,.lt textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--hair);border-radius:12px;background:#FAFAFC;color:var(--ink);font-size:14px}
.lt textarea{resize:vertical;min-height:72px;line-height:1.5}
.lt .lbl{color:var(--ink-3)}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.4;color:var(--fg);cursor:pointer}
.check input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--lime)}
.check:has(input:disabled){color:var(--dim);cursor:default}
.check:has(input:not(:disabled)) .needs{display:none}
.hint{font-size:12px;color:var(--dim);line-height:1.45}
.err{font-size:13px;font-weight:600;color:var(--err)}
.err:empty{display:none}

/* two-column pages: a side column next to the gradient panel, as in Overlap */
.cols{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.side{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:12px}
.cols>.main{flex:999 1 560px}
.sticky{position:sticky;top:16px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.title-wrap{min-width:0;display:flex;flex-direction:column;gap:10px}
.head .title-wrap{flex:1 1 320px}

/* ---------- top bar ---------- */
.top{background:var(--panel);border-radius:24px;padding:12px;display:flex;align-items:center;gap:14px;box-shadow:inset 0 0 0 1px var(--edge)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg);min-width:0;padding-right:6px}
.logo{width:52px;height:52px;flex:none;border-radius:16px;background:var(--lav);display:grid;place-items:center}
.logo img{width:40px;height:40px;display:block}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-text strong{font-size:18px;font-weight:700;letter-spacing:.01em}
.brand-text span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{flex:1 1 auto;min-width:0;display:flex;justify-content:center}
.nav .seg{align-self:auto}
.nav .short{display:none}
.theme-btn{width:52px;height:52px;flex:none;border-radius:16px;background:var(--raised);display:grid;place-items:center}
.theme-btn:hover{background:var(--raised-2)}
.amore{min-height:52px;border-radius:16px;padding:0 18px}
.amore small{font-weight:500;opacity:.7}
.banner{background:var(--warn);color:var(--warn-fg);border-radius:16px;padding:12px 16px;font-size:14px;font-weight:600}

/* ---------- home ---------- */
.hero{flex-direction:row;align-items:center;gap:36px;padding:36px}
.hero-text{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:18px}
.hero-mark{width:132px;height:auto;display:block}
.hero h1{font-size:56px}
.lead{font-size:18px;line-height:1.6;color:var(--ink-2)}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.hero-photo{flex:1.35 1 460px;min-width:0;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:22px;box-shadow:0 14px 40px rgba(40,50,90,.18)}
.lineage{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.lineage span,.lineage a{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.75);text-decoration:none;color:var(--ink)}
.lineage a:hover{background:#fff}
.lineage .me{background:var(--ink);color:#fff}
.lineage i{font-style:normal;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{background:var(--panel);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px;color:var(--fg);text-decoration:none;box-shadow:inset 0 0 0 1px var(--edge)}
.tile:hover{background:var(--panel-hover)}
.tile-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink)}
.tile h2{font-size:18px}
.tile p{font-size:14px;line-height:1.5;color:var(--muted)}
.prayer{border-radius:28px;padding:40px 28px;color:var(--ink);display:flex;flex-direction:column;gap:24px;scroll-margin-top:16px;
  background:radial-gradient(45% 35% at 10% 12%,rgba(255,255,255,.8),transparent 70%),radial-gradient(40% 30% at 92% 88%,rgba(255,255,255,.75),transparent 70%),radial-gradient(35% 25% at 70% 8%,rgba(255,255,255,.45),transparent 70%),linear-gradient(180deg,#C6D8EE 0%,#9FBADB 100%)}
.prayer-head{display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center}
.prayer-head p{max-width:560px}
.prayer-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;max-width:1080px;width:100%;margin:0 auto}
.pcard{background:#fff;border-radius:28px;padding:30px 30px 34px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(40,70,120,.12)}
.pcard h3{font-size:24px;font-weight:700;text-align:center;margin-bottom:4px}
.pcard p{font-size:17px;line-height:1.55;color:#1A1A1F}
.pcard .resp{font-weight:700;color:var(--ink);background:var(--cell);border-radius:12px;padding:10px 14px}
.pcard .resp span{font-weight:500;color:var(--ink-3)}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px;padding:18px 8px 8px;font-size:13px;color:var(--dim);text-align:center}
.foot img{width:34px;height:auto;opacity:.85}
.foot a{color:var(--muted)}

/* ---------- calendar ---------- */
.about{display:flex;flex-direction:column;gap:12px;max-width:760px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.65);font-size:14px;font-weight:600}
.pill i{width:10px;height:10px;border-radius:3px;display:inline-block}
.calcard{background:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.cal-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cal-top strong{font-size:20px;font-weight:600;min-width:150px}
.cal-top .seg{margin-left:auto}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--hair);border-left:1px solid var(--hair);border-radius:14px;overflow:hidden}
.mdow{padding:8px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--ink-3);border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);background:#FAFAFC}
.mcell{min-height:108px;padding:6px;display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);background:#fff;color:var(--ink);min-width:0}
.mcell.out{background:#FAFAFC;color:#9A9AA3}
.mcell .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600}
.mcell.today .num{background:var(--violet);color:#fff}
button.mcell:hover{background:#F6F4FD}
.mcell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cchip{display:block;border-radius:6px;padding:3px 7px;font-size:12px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip.dinner{background:var(--peach)}
.cchip.cg{background:var(--lav)}
.cchip.off{background:var(--cell);color:var(--ink-3);text-decoration:line-through}
.mcount{font-size:11px;font-weight:600;color:var(--ink-3);padding-left:2px}
.lrows{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 10px;border-radius:18px;background:#F6F5FA;color:var(--ink);text-align:left;width:100%}
.lrow:hover{background:#EFEDF8}
.lrow.sel{box-shadow:inset 0 0 0 2px var(--ink);background:#fff}
.lrow.past{opacity:.6}
.ldate{width:58px;height:64px;flex:none;border-radius:14px;background:var(--lav);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ldate small{font-size:11px;font-weight:700;letter-spacing:.04em}
.ldate b{font-size:22px;font-weight:700}
.linfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.linfo strong{font-size:15px}
.linfo span{font-size:13px;color:var(--ink-3)}
.lmeta{font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.block h2{font-size:24px}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.facts li{display:flex;align-items:center;gap:12px}
.fact-ic{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;color:var(--ink)}
.facts small{display:block;font-size:12px;color:var(--muted)}
.facts strong{font-size:16px;font-weight:600}
.facts .tba{color:var(--muted);font-style:italic;font-weight:500}
.dayevs{display:flex;flex-direction:column;gap:8px}
.dayev{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.dayev-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.dayev-top strong{font-size:16px;font-weight:700;color:var(--ink);overflow-wrap:anywhere;min-width:0}
.dayev-top span{white-space:nowrap}
.dayev .evc-desc{font-size:14px}
.dayev .nobody{display:none}
.off-note{background:var(--warn);color:var(--warn-fg);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
.ticks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tick{position:relative;display:flex;align-items:center;gap:10px;min-height:60px;padding:10px 12px;border-radius:16px;background:var(--raised);cursor:pointer}
.tick:hover{background:var(--raised-2)}
.tick input{position:absolute;opacity:0;width:1px;height:1px}
.tick .box{width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--box-line);display:grid;place-items:center;color:transparent}
.tick strong{display:block;font-size:14px}
.tick small{font-size:12px;color:var(--muted)}
.tick:has(input:checked){background:var(--lime);color:var(--ink)}
.tick:has(input:checked) .box{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.tick:has(input:checked) small{color:var(--ink-2)}
.tick:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.tick:has(input:disabled){opacity:.45;cursor:default}
.who-list{display:flex;flex-direction:column;gap:8px}
.who-list h4{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.name{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 3px;border-radius:16px;background:var(--raised);font-size:13px;font-weight:500}
.name.me{background:var(--me);color:var(--me-fg)}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.docs li{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 8px;border-radius:14px;background:var(--raised)}
.doc-ic{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink)}
.doc-text{flex:1;min-width:0;display:flex;flex-direction:column}
.doc-text a{font-size:14px;font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-text a:hover{text-decoration:underline}
.doc-text small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{height:32px;padding:0 12px;border-radius:16px;background:#fff;color:var(--ink);font-size:13px;font-weight:600;display:inline-flex;align-items:center;text-decoration:none}
.view:hover{background:var(--lime)}
.cg-edit{display:flex;flex-direction:column;gap:12px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

/* ---------- events ---------- */
.evlist{display:flex;flex-direction:column;gap:12px;max-width:900px}
.evcard{display:flex;align-items:stretch;border-radius:22px;overflow:hidden;color:var(--ink);box-shadow:0 1px 0 rgba(11,11,11,.06)}
.c-lime{background:var(--lime)} .c-lav{background:var(--lav)} .c-pink{background:var(--pink)}

.evc-top{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;color:var(--ink-2)}
.evc-top span:last-child{white-space:nowrap}
.evc-title{font-size:21px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.evc-desc{font-size:15px;line-height:1.55;color:#26262E;white-space:pre-wrap;overflow-wrap:anywhere}

.more{align-self:flex-start;font-size:13px;font-weight:700;text-decoration:underline;color:var(--ink-2)}
.evc-loc{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-2)}
.evc-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.join{height:40px;padding:0 16px;border-radius:20px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}

.join.on{background:#fff;color:var(--ink)}
.join.on:hover{background:#F3F2F8}
.going{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 6px;border-radius:20px;background:rgba(255,255,255,.55);font-size:14px;font-weight:600;color:var(--ink)}
.going:hover{background:rgba(255,255,255,.85)}
.stack{display:inline-flex}
.stack .avatar{box-shadow:0 0 0 2px #fff}
.stack .avatar+.avatar{margin-left:-8px}
.nobody{font-size:13px;font-weight:500;color:var(--ink-2)}
.evc-tools{margin-left:auto;display:flex;gap:2px}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ic:hover{background:rgba(255,255,255,.6)}
.evc-pic{flex:0 0 220px;display:block;background:rgba(255,255,255,.4)}

/* ---------- gallery ---------- */
.masonry{columns:3 240px;column-gap:12px}
.photo{display:block;width:100%;margin:0 0 12px;break-inside:avoid;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.5)}
.photo img{display:block;width:100%;height:auto;transition:transform .25s}
.photo:hover img{transform:scale(1.03)}
.lb{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:12px;border:0;background:rgba(5,5,5,.93);color:#fff;overflow:hidden}
.lb[open]{display:flex;align-items:center;justify-content:center}
.lb::backdrop{background:transparent}
.lb-bar{position:absolute;top:12px;left:18px;right:12px;display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600}
.lb-count{flex:1;min-width:0;color:#C9C9CF}
.lb-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.lb-btn:hover{background:rgba(255,255,255,.16)}
.lb-img{display:block;height:auto;border-radius:14px}
.lb-prev,.lb-next{position:absolute;top:50%;margin-top:-22px;background:rgba(5,5,5,.6)}
.lb-prev{left:12px}
.lb-next{right:12px}

.sheet-card{background:#fff;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;color:var(--ink)}

.sheet{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px}
.sheet th,.sheet td{padding:0;width:112px;vertical-align:top;text-align:left;font-weight:400;background:#fff;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.sheet thead{position:sticky;top:0;z-index:2}
.sheet thead th{background:#FAFAFC}
.sheet .hd th{padding:7px 8px;font-weight:700;white-space:nowrap}
.sheet .past{background:#DCE9EC;border-color:#C4D7DB}
.sheet .today{background:#F3F0FF}
.sheet .hd .today{background:var(--violet);color:#fff}
.sheet .wkend{border-right:2px solid #B4B2C0}
.sheet .rowh{position:sticky;left:0;z-index:1;width:124px;background:#FAFAFC;border-right:2px solid #B4B2C0}
.sheet .rowh.lab{padding:7px 8px;font-weight:700}
.sheet .rowh.lab.int{font-style:italic}
.sheet thead .rowh{z-index:3}
.rowname{display:flex;align-items:flex-start}
.rowname .xc{flex:1;min-width:0;font-weight:600}
.rowname .x{width:26px;height:26px;margin:3px 2px 0 0}
.wk .xc{text-align:center;font-weight:700}
.xc{min-height:31px;padding:7px 8px;line-height:1.3;overflow-wrap:anywhere;outline:0;cursor:text}
.xc:focus{box-shadow:inset 0 0 0 2px var(--violet);background:#fff}
.xc.bad{box-shadow:inset 0 0 0 2px #C62828}
.xc[data-ph]:empty::before{content:attr(data-ph);color:#8A8A94;font-weight:500}
.addrow th,.addrow td{background:#FAFAFC;border-bottom:0}
.addform{display:flex;align-items:center;gap:2px;padding:4px}
.addform input{width:100%;min-width:0;height:30px;padding:0 6px;border:1px solid var(--hair);border-radius:8px;background:#fff;color:var(--ink);font-size:13px}
.addform button{width:28px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;color:var(--ink)}
.addform button:hover{background:var(--cell)}
.addhint{padding:9px 10px;font-size:13px;color:var(--ink-3)}

/* ---------- forums ---------- */
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.notes li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--raised);font-size:14px;line-height:1.45;color:var(--fg-2)}
.notes svg{margin-top:1px;color:var(--accent)}
.notes strong{color:var(--fg)}
.link-muted{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.link-muted:hover{color:var(--fg)}
.feed{display:flex;flex-direction:column;gap:12px;max-width:900px}
.post{background:#fff;border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.post-head{display:flex;align-items:center;gap:10px}

.post-head strong{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post-head .when{font-size:12px;color:var(--ink-3)}
.post-text{font-size:16px;line-height:1.6;color:#1A1A1F;white-space:pre-wrap;overflow-wrap:anywhere}
.replies{list-style:none;margin:0;padding:0 0 0 14px;border-left:3px solid var(--cell);display:flex;flex-direction:column;gap:12px}
.replies li{display:flex;flex-direction:column;gap:4px}
.reply-head{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.reply-head strong{color:var(--ink);font-weight:600}

.reply-form{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:#F6F5FA}
.reply-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.link-btn{align-self:flex-start;font-size:14px;font-weight:600;color:var(--violet);padding:4px 0}
.link-btn:hover{text-decoration:underline}
.btn-sm{height:38px;padding:0 16px;border-radius:12px;background:var(--ink);color:#fff;font-size:14px;font-weight:600}
.btn-sm:hover{background:#2A2A2A}
.btn-sm.ghost{background:transparent;color:var(--ink-2)}
.btn-sm.ghost:hover{background:rgba(11,11,11,.06)}
.post-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pray{height:40px;padding:0 16px;border-radius:20px;background:var(--cell);color:var(--ink);font-size:14px;font-weight:600}
.pray:hover{background:#E4E1F1}
.pray.on{background:var(--violet);color:#fff}
.pray-count{font-size:13px;color:var(--ink-3)}

/* ---------- dialog, popover, toast ---------- */
dialog.dlg{width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);padding:0;border:0;border-radius:24px;background:var(--panel);color:var(--fg);overflow:auto}
dialog.dlg::backdrop{background:rgba(5,5,5,.65)}
.dform{padding:24px;display:flex;flex-direction:column;gap:14px}
.picbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.picbox img{width:120px;height:84px;object-fit:cover;border-radius:12px;display:block}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0;width:1px;height:1px}
.swatches span{width:36px;height:36px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.swatches input:checked+span{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--fg)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:4px}
.pop{position:fixed;z-index:20;width:230px;padding:14px 16px;background:#fff;color:var(--ink);border-radius:16px;box-shadow:0 12px 32px rgba(11,11,11,.22),0 0 0 1px rgba(11,11,11,.06);pointer-events:none;display:flex;flex-direction:column;gap:8px}
.pop-title{font-size:14px;font-weight:700}
.pop-row{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.pop-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-more{font-size:12px;color:var(--ink-3)}
#toast{position:fixed;left:50%;bottom:24px;z-index:30;max-width:calc(100vw - 32px);transform:translate(-50%,16px);background:var(--toast);color:var(--toast-fg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:1140px){
  .top{flex-wrap:wrap}
  .brand{flex:1 1 auto}
  .nav{order:3;flex:1 1 100%;justify-content:flex-start}
  .nav .seg{width:100%}
  .nav .seg a{flex:1 0 auto;justify-content:center}
}
@media (max-width:923px){
  .cols{flex-direction:column;align-items:stretch}
  .cols>*{flex:1 1 auto}
  .cols.main-first>.main{order:1}
  .cols.main-first>.side{order:2}
  .sticky{position:static}
  .hero{flex-direction:column;align-items:stretch;padding:28px;gap:24px}
  .hero-text,.hero-photo{flex:none}
}
@media (max-width:600px){
  #app{padding:10px;gap:10px}
  .main{padding:18px;border-radius:22px}
  .hero{padding:22px 18px}
  h1{font-size:30px}
  .hero h1{font-size:38px}
  .hero-mark{display:none}
  .lead{font-size:16px}
  .brand{flex:1 1 0;gap:10px;padding-right:0}
  .brand-text span{display:none}
  .logo{width:44px;height:44px;border-radius:14px}
  .logo img{width:34px;height:34px}
  .theme-btn{width:44px;height:44px;border-radius:14px}
  .amore{min-height:44px;padding:0 14px}
  .amore small{display:none}
  .nav .seg{display:grid;grid-template-columns:repeat(3,1fr)}
  .nav .seg a{padding:0 6px;min-height:40px}
  .nav .full{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .nav .short{display:inline}
  .prayer{padding:28px 14px}
  .pcard{padding:24px 20px}
  .pcard p{font-size:16px}
  .calcard{padding:12px}
  .mcell{min-height:64px;padding:4px;gap:3px}
  .mcell .num{width:24px;height:24px;font-size:12px}
  .cchip{height:6px;padding:0;font-size:0}
  .mcount{display:none}
  .evcard{flex-direction:column-reverse}
  .evc-pic{flex:none}
  .evc-pic img{min-height:0;height:170px}
  .ticks{grid-template-columns:1fr}
  .sheet-card{padding:10px;border-radius:18px}
  .sheet-bar .lbl{flex:1 1 130px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}#toast{transition:none}}

function todayKey() { var n = new Date(); return dkey(n.getFullYear(), n.getMonth(), n.getDate()); }

function daysIn(y, m) { return new Date(Date.UTC(y, m + 1, 0)).getUTCDate(); }
function yearSuffix(y) { return y !== new Date().getFullYear() ? ' ' + y : ''; }
function longDate(k) { var p = parseKey(k); return DOW[dowOf(k)] + ' ' + p.d + ' ' + MON[p.m] + yearSuffix(p.y); }
function dayMon(k) { var p = parseKey(k); return p.d + ' ' + MON[p.m].slice(0, 3) + yearSuffix(p.y); }
function fmtTime(t) { if (!t) return ''; var h = +t.slice(0, 2), m = t.slice(3); return (h % 12 || 12) + ':' + m + (h < 12 ? ' AM' : ' PM'); }
function shortTime(t) { var h = +t.slice(0, 2), m = t.slice(3); return (h % 12 || 12) + (m === '00' ? '' : ':' + m) + (h < 12 ? ' AM' : ' PM'); }

  var s = (Date.now() - ms) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 7 * 86400) return Math.floor(s / 86400) + 'd ago';
  var d = new Date(ms);
  return d.getDate() + ' ' + MON[d.getMonth()].slice(0, 3) + yearSuffix(d.getFullYear());
}
function fmtSize(n) { return n < 1024 ? n + ' B' : n < 1048576 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }

}

function find(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

  for (var i = 0; i < list.length; i++) if (list[i].id === item.id) { list[i] = item; return; }

}

/* ---------- server ---------- */
function api(method, url, body, headers) {
  var init = { method: method, headers: headers || {} };
  if (body instanceof Blob) { init.body = body; init.headers['Content-Type'] = body.type || 'application/octet-stream'; }
  else if (body) { init.body = JSON.stringify(body); init.headers['Content-Type'] = 'application/json'; }
  return fetch(url, init).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) throw Object.assign(new Error(j.error || 'error'), { status: r.status });
      return j;
    });
  });
}
function refresh(quiet) {
  return fetch('/api/state?c=' + encodeURIComponent(client), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('status ' + r.status); return r.text(); })
    .then(function (txt) {
      var wasOff = S.offline, changed = txt !== lastJson;
      lastJson = txt;
      S.data = JSON.parse(txt);
      S.loaded = true; S.offline = false;
      if (changed || wasOff || !quiet || S.stale) softRender();
    })
    .catch(function () { if (!S.offline) { S.offline = true; softRender(); } });
}
function softRender() { // background refreshes wait while someone is typing or has a form open
  var a = document.activeElement;
  if (dlg.open || (a && app.contains(a) && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))) { S.stale = true; return; }
  render();
}
function poll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(function () {
    (document.visibilityState === 'visible' ? refresh(true) : Promise.resolve()).then(poll, poll);
  }, S.offline ? 10000 : 30000);
}
function showErr(err) {
  var s = err && err.status;
  toast(!s ? 'Can’t reach the server. Check your connection and try again.'
    : s === 413 ? 'That file is too big. The limit is 10 MB.'
    : s === 409 ? 'This list is full, so that couldn’t be added.'
    : s === 403 ? 'Only the person who posted this can remove it.'
    : s === 404 ? 'That was already removed.'
    : 'Something went wrong (' + err.message + '). Please try again.');
  if (s === 404) refresh(true);
}
function busy(k, on) { S.busy[k] = on; }

function hue(name) { var h = 0, s = String(name).toLowerCase(); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return AVATAR[h % AVATAR.length]; }
function initials(name) { var w = String(name).trim().split(/\s+/); return ((w[0] || '?').charAt(0) + (w[1] ? w[1].charAt(0) : '')).toUpperCase(); }
function avatar(name, cls, one) {

}

function eventsOn(k) { return S.data.events.filter(function (e) { return e.date <= k && k <= evEnd(e); }).sort(byStart); }
function calendar() {

function docIcon(name) {

function upcoming() { return S.data.events.filter(function (e) { return evEnd(e) >= today; }).sort(byStart); }
function byStart(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.time || '') < (b.time || '') ? -1 : 1; }

/* ---------- exam prayers: a shared sheet with one column per day; each cell saves itself when you leave it ---------- */
var CELL_TYPE = (function () { var d = document.createElement('div'); try { d.contentEditable = 'plaintext-only'; return d.contentEditable === 'plaintext-only' ? 'plaintext-only' : 'true'; } catch (e) { return 'true'; } })();
var CELL_MAX = { cell: 120, name: 40, week: 40, day: 40 };
var NAME_W = 124, DAY_W = 112;
function mondayOf(k) { return addDays(k, -((dowOf(k) + 6) % 7)); }
function xcell(id, attrs, value, label, hint) {
  return '<div class="xc" id="' + id + '" contenteditable="' + CELL_TYPE + '" role="textbox" spellcheck="false" ' + attrs + ' aria-label="' + esc(label) + '"' + (hint ? ' data-ph="' + esc(hint) + '"' : '') + '>' + esc(value || '') + '</div>';
}
function pageExams() {
  var x = S.data.exams, days = [], weeks = [], k;
  for (k = x.from; k && k <= x.to; k = addDays(k, 1)) {
    var mon = mondayOf(k), w = weeks[weeks.length - 1];
    if (!w || w.mon !== mon) weeks.push(w = { mon: mon, span: 0 });
    w.span++; w.last = k;
    days.push(k);
  }
  var col = function (d) { return (d < today ? ' past' : d === today ? ' today' : '') + (dowOf(d) === 0 ? ' wkend' : ''); };
  var hdr = function (label, cell) { return '<tr class="hd"><th class="rowh lab" scope="row">' + label + '</th>' + days.map(function (d) { return '<th class="' + col(d) + '" scope="col">' + cell(d) + '</th>'; }).join('') + '</tr>'; };
  return '<section class="main">' +
    '<div class="title-wrap"><span class="eyebrow">Exam Prayers</span><h1>We pray for each other</h1>' +
      '<p class="sub-ink">Add your name, then type your exams and deadlines under each date. Intercessors sign up to pray for everyone on that day.</p></div>' +
    '<div class="sheet-card">' +
      '<form class="sheet-bar lt" data-form="ex-range">' +
        '<label class="lbl">From<input type="date" id="ex-from" value="' + esc(x.from) + '"></label>' +
        '<label class="lbl">To<input type="date" id="ex-to" value="' + esc(x.to) + '"></label>' +
        '<button class="btn-sm">Update dates</button>' +
        '<p class="sheet-note">Click any cell to type, including the week names. Everything saves by itself, and anyone can edit.</p>' +
      '</form>' +
      (!S.loaded ? '<div class="addhint">Loading the sheet…</div>' :
      '<div class="sheet-wrap" id="sheet-wrap"><table class="sheet lt" style="width:' + (NAME_W + DAY_W * days.length) + 'px">' +
        '<thead>' +
          hdr('Day', function (d) { return DOW[dowOf(d)]; }) +
          '<tr><th class="rowh lab" scope="row">Week</th>' + weeks.map(function (w) {
            return '<th class="wk' + (w.last < today ? ' past' : '') + ' wkend" colspan="' + w.span + '">' + xcell('xw-' + w.mon, 'data-x="week" data-k="' + w.mon + '"', x.weeks[w.mon], 'Name of the week starting ' + longDate(w.mon), 'Name this week') + '</th>';
          }).join('') + '</tr>' +
          hdr('Date', function (d) { var p = parseKey(d); return p.d + ' ' + MON[p.m].slice(0, 3); }) +
          '<tr><th class="rowh lab int" scope="row">Intercessor</th>' + days.map(function (d) {
            return '<th class="' + col(d) + '">' + xcell('xi-' + d, 'data-x="day" data-k="' + d + '" data-col="' + d + '"', x.intercessors[d], 'Intercessor for ' + longDate(d)) + '</th>';
          }).join('') + '</tr>' +
        '</thead><tbody>' +
          x.rows.map(function (r) {
            return '<tr><th class="rowh" scope="row"><div class="rowname">' + xcell('xn-' + r.id, 'data-x="name" data-id="' + r.id + '" data-col="name"', r.name, 'Name') +
              '<button class="x" data-act="ex-row-del" data-id="' + r.id + '" aria-label="Remove ' + esc(r.name) + '" title="Remove">' + ICON.x + '</button></div></th>' +
              days.map(function (d) {
                return '<td class="' + col(d) + '">' + xcell('xc-' + r.id + '-' + d, 'data-x="cell" data-id="' + r.id + '" data-k="' + d + '" data-col="' + d + '"', r.cells[d], r.name + ', ' + longDate(d)) + '</td>';
              }).join('') + '</tr>';
          }).join('') +
          '<tr class="addrow"><th class="rowh"><form class="addform" data-form="ex-add"><input id="ex-new" data-draft="ex.new" value="' + esc(draft('ex.new')) + '" maxlength="40" placeholder="Add a name" aria-label="Add a name to the sheet"><button aria-label="Add this name" title="Add">' + ICON.plus + '</button></form></th>' +
            '<td colspan="' + days.length + '">' + (x.rows.length ? '' : '<div class="addhint">No names yet. Add yours here to start.</div>') + '</td></tr>' +
        '</tbody></table></div>') +
    '</div>' +
  '</section>';
}

function shrinkImage(file) { // big phone photos are scaled to 1600px and saved as JPEG before uploading
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 1600 / Math.max(w, h)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
      var g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { if (b) resolve({ blob: b, w: c.width, h: c.height }); else reject(new Error('image')); }, 'image/jpeg', 0.86);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}
function pickPicture(file) {

    f.blob = pic.blob; f.blobUrl = URL.createObjectURL(pic.blob); f.fileName = file.name.replace(/\.[^.]+$/, '') + '.jpg';

function cellText(el) { return el.textContent.replace(/\s+/g, ' ').trim(); }
function saveCell(el) { // called when a cell loses focus; only a changed cell, or one that failed last time, is sent
  var x = el.getAttribute('data-x'), id = el.getAttribute('data-id'), k = el.getAttribute('data-k');
  var v = cellText(el).slice(0, CELL_MAX[x]), was = el.getAttribute('data-was');
  el.removeAttribute('data-was');
  if (was === null) return;
  if (x === 'name' && !v) { el.textContent = was; toast('A row needs a name. Use the × to remove it.'); return; }
  el.textContent = v; // also clears the stray line break browsers leave in an emptied cell
  if (v === was && !el.classList.contains('bad')) return;
  (x === 'cell' ? api('PUT', '/api/exams/rows/' + id, { date: k, text: v })
    : x === 'name' ? api('PUT', '/api/exams/rows/' + id, { name: v })
    : api('POST', '/api/exams/sheet', x === 'week' ? { week: k, label: v } : { day: k, name: v })).then(function (r) {

    el.classList.add('bad');

/* who's going: a card that follows the hovered or tapped "going" button, like reactions in a chat */
function showPop(el) {
  var e = find(S.data.events, el.getAttribute('data-pop'));
  if (!e || !e.joins.length) return;
  var max = 12;
  pop.innerHTML = '<div class="pop-title">Going · ' + e.joins.length + '</div>' + e.joins.slice(0, max).map(function (j) {
    return '<div class="pop-row">' + avatar(j.name, 'sm') + '<span>' + esc(j.name) + '</span></div>';
  }).join('') + (e.joins.length > max ? '<div class="pop-more">and ' + (e.joins.length - max) + ' more</div>' : '');
  pop.hidden = false;
  var r = el.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  var top = r.bottom + 8 + h > window.innerHeight - 8 ? r.top - h - 8 : r.bottom + 8;
  pop.style.top = Math.max(8, top) + 'px';
  pop.style.left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8) + 'px';
  popFor = el;
}
function hidePop() { pop.hidden = true; popFor = null; }
// a mouse shows it on hover; touch and keyboard toggle it with a tap or Enter (see the click handler)
document.addEventListener('pointerover', function (e) {
  if (e.pointerType !== 'mouse') return;
  var el = e.target.closest && e.target.closest('[data-pop]');
  if (el && el !== popFor) showPop(el);
});
document.addEventListener('pointerout', function (e) {
  if (e.pointerType !== 'mouse') return;
  var el = e.target.closest && e.target.closest('[data-pop]');
  if (el && (!e.relatedTarget || !el.contains(e.relatedTarget))) hidePop();
});

window.addEventListener('resize', hidePop);

document.addEventListener('click', function (e) {

  if (popFor) hidePop();
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act'), id = t.getAttribute('data-id'), v = t.getAttribute('data-v');
  switch (act) {
    case 'theme': setTheme(S.theme === 'dark' ? 'light' : 'dark'); break;
    case 'to-prayer': document.getElementById('prayer').scrollIntoView(); break;
    case 'cal-prev': case 'cal-next':
      var m = S.cal.m + (act === 'cal-next' ? 1 : -1);
      S.cal = { y: S.cal.y + Math.floor(m / 12), m: (m + 12) % 12 }; render(); break;
    case 'cal-today':
      S.sel = nextThursday(today); var p = parseKey(S.sel); S.cal = { y: p.y, m: p.m }; S.cgForm = null; render(); break;
    case 'cal-view': S.calView = v; render(); break;
    case 'day-sel':

      if (window.innerWidth <= 923) document.getElementById('block').scrollIntoView({ block: 'start' });
      break;
    case 'cg-edit': var s = session(S.sel); S.cgForm = { location: s.location, topic: s.topic, dinner: s.dinner, time: s.time, off: s.off }; render();
      var loc = document.getElementById('cgf-location'); if (loc) loc.focus(); break;
    case 'cg-cancel': S.cgForm = null; render(); break;
    case 'doc-pick': docFile.value = ''; docFile.click(); break;
    case 'doc-del': deleteDoc(id); break;
    case 'ev-tab': S.evTab = v; render(); break;

    case 'ev-new': openEvent(null); break;
    case 'ev-edit': openEvent(find(S.data.events, id)); break;
    case 'ev-del': deleteEvent(id); break;
    case 'ev-join': joinEvent(id); break;
    case 'ev-more': S.more[id] = !S.more[id]; render(); break;
    case 'pic-pick': picFile.value = ''; picFile.click(); break;
    case 'pic-remove':
      if (S.evForm.blobUrl) URL.revokeObjectURL(S.evForm.blobUrl);

      document.getElementById('picbox').innerHTML = picbox(); break;
    case 'dlg-close': closeDialog(); break;
    case 'ph-add': photoFile.value = ''; photoFile.click(); break;
    case 'ph-open': showPhoto(id); break;
    case 'ph-step': stepPhoto(+v); break;
    case 'ph-close': lb.close(); break;
    case 'ph-del': deletePhoto(id); break;
    case 'ex-row-del': deleteRow(id); break;
    case 'q-del': deletePost('q', id); break;

    case 'r-open': S.replyOpen[id] = true; render(); var rt = document.getElementById('r-text-' + id); if (rt) rt.focus(); break;
    case 'r-close': S.replyOpen[id] = false; render(); break;

document.addEventListener('input', function (e) {

    S.draft[t.getAttribute('data-draft')] = t.type === 'checkbox' ? t.checked : t.value;
    if (t.id === 'q-name') { var dm = document.getElementById('q-dm'); if (dm) { dm.disabled = !t.value.trim(); if (dm.disabled) dm.checked = false; } }
  } else if (t.hasAttribute('data-f') && S.evForm) S.evForm[t.getAttribute('data-f')] = t.value;
  else if (t.hasAttribute('data-cgf') && S.cgForm) S.cgForm[t.getAttribute('data-cgf')] = t.type === 'checkbox' ? t.checked : t.value;
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.hasAttribute('data-tick')) rsvp(t.getAttribute('data-tick'), t.checked, t);
});
document.addEventListener('submit', function (e) {
  var f = e.target, k = f.getAttribute('data-form');
  if (!k) return;
  e.preventDefault();
  if (k === 'q' || k === 'p') sendPost(k);
  else if (k === 'r') sendReply(f.getAttribute('data-id'));
  else if (k === 'cg') saveCg();
  else if (k === 'ev') saveEvent();
  else if (k === 'ex-range') saveRange();
  else if (k === 'ex-add') addRow();
  else if (k === 'name') {
    var v = document.getElementById('dlg-name').value.trim();
    if (!v) { document.getElementById('dlg-name').focus(); return; }
    var then = S.afterName;
    setName(v); closeDialog();
    if (then) then();
  }
});
docFile.addEventListener('change', function () { if (docFile.files[0]) uploadDoc(docFile.files[0]); });
picFile.addEventListener('change', function () { if (picFile.files[0]) pickPicture(picFile.files[0]); });
photoFile.addEventListener('change', function () { if (photoFile.files.length) addPhotos(photoFile.files); });
lb.addEventListener('click', function (e) { if (e.target === lb) lb.close(); });
document.addEventListener('focusin', function (e) { if (e.target.classList && e.target.classList.contains('xc')) e.target.setAttribute('data-was', cellText(e.target)); });
document.addEventListener('focusout', function (e) { if (e.target.classList && e.target.classList.contains('xc')) saveCell(e.target); });
document.addEventListener('paste', function (e) { // cells take plain text on one line, whatever was copied
  if (!e.target.closest || !e.target.closest('.xc')) return;
  e.preventDefault();
  document.execCommand('insertText', false, e.clipboardData.getData('text/plain').replace(/\s+/g, ' '));
});
document.addEventListener('keydown', function (e) {
  if (lb.open && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { stepPhoto(e.key === 'ArrowLeft' ? -1 : 1); return; }
  var el = e.target;
  if (!el.classList || !el.classList.contains('xc')) return;
  if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); moveCell(el, e.shiftKey && e.key === 'Enter' ? -1 : 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveCell(el, -1); }
  else if (e.key === 'Escape') { el.textContent = el.getAttribute('data-was') || ''; el.blur(); }
});
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refresh(true); });
window.addEventListener('hashchange', route);
setInterval(function () { // keep "today" right for pages left open past midnight
  var k = todayKey();
  if (k !== today) { today = k; now = parseKey(k); softRender(); }
}, 60000);

route();
refresh().then(poll);
})();
</script>
