# Render Blueprint for ICY NUS: a free web service running server.js, plus a free Postgres database
# so sign-ups, posts and uploaded files survive restarts (the free web service's own disk is wiped when it restarts).
services:
  - type: web
    name: icy-nus
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/ping
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icy-db
          property: connectionString

databases:
  - name: icy-db
    plan: free
