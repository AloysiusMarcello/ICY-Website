# Render Blueprint for ICY NUS: a free web service running server.js, in Singapore to be near NUS.
# Data lives in a free Neon Postgres database rather than a Render one: Render allows one free database per
# workspace (Overlap has it) and deletes free databases 30 days after creation. Render asks for the Neon
# connection string as DATABASE_URL when the Blueprint is created; without it, data is wiped on every restart.
services:
  - type: web
    name: icy-nus
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/ping
    envVars:
      - key: DATABASE_URL
        sync: false
